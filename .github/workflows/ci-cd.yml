name: Pipeline CI/CD - Tienda TecNM Huejutla
on:
  push:
    branches: [ "main", "desarrollo" ]
jobs:
  verificar-sintaxis-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pgsql
      - name: Validar sintaxis PHP
        run: find . -name "*.php" -print0 | xargs -0 -n1 -P8 php -l